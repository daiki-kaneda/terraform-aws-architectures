name: 04-spa-frontend-prod CD

on: 
    push:
        branches: 
            - main
        paths:
            - '04-spa-frontend/environments/prod/**'
            - '04-spa-frontend/modules/**'
    workflow_dispatch:

permissions:
    id-token: write
    contents: read
    pull-requests: write

jobs: 
    plan:
        uses: ./.github/workflows/reusable-terraform-cd-prod.yaml
        with:
            working-directory: 04-spa-frontend/environments/prod/
