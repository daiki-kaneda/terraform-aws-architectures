# アプリディレクトリで依存関係を入れて pytest を実行する。
name: Reusable Python App CI

on:
    workflow_call:
        inputs:
            working-directory:
                type: string
                required: true

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ inputs.working-directory }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip
                cache-dependency-path: |
                    ${{ inputs.working-directory }}/requirements.txt
                    ${{ inputs.working-directory }}/requirements-dev.txt
            - name: Install
              run: python -m pip install -r requirements-dev.txt
            - name: Test
              run: python -m pytest
