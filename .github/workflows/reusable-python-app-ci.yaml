# アプリディレクトリで依存関係を入れて pytest を実行する。
# run-ruff が true のときだけ、Ruff の整形とチェックも行う。
name: Reusable Python App CI

on:
    workflow_call:
        inputs:
            working-directory:
                type: string
                required: true
            run-ruff:
                type: boolean
                required: false
                default: false

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ inputs.working-directory }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: pip
                cache-dependency-path: |
                    ${{ inputs.working-directory }}/requirements.txt
                    ${{ inputs.working-directory }}/requirements-dev.txt
            - name: Install
              run: python -m pip install -r requirements-dev.txt
            - name: Test
              run: python -m pytest
            - name: Ruff format
              if: inputs.run-ruff
              run: python -m ruff format --check .
            - name: Ruff check
              if: inputs.run-ruff
              run: python -m ruff check .
