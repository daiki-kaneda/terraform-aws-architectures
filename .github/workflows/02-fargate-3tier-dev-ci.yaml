name: 02-fargate-3tier-dev CI

on: 
    pull_request:
        branches: 
            - main
        paths:
            - '02-fargate-3tier/dev/**'
            - '02-fargate-3tier/modules/**'
    workflow_dispatch:

permissions:
    id-token: write
    contents: read
    pull-requests: write
        
jobs: 
    plan:
        uses: ./.github/workflows/reusable-terraform-ci.yaml
        with:
            working-directory: '02-fargate-3tier/dev/'