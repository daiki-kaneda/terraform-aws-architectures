name: 03-serverless-api-prod CI

on: 
    pull_request:
        branches: 
            - main
        paths:
            - '03-serverless-api/environments/prod/**'
            - '03-serverless-api/modules/**'
            - '03-serverless-api/app/openapi.yaml'
    workflow_dispatch:

permissions:
    id-token: write
    contents: read
    pull-requests: write
        
jobs: 
    plan:
        uses: ./.github/workflows/reusable-terraform-ci.yaml
        with:
            working-directory: 03-serverless-api/environments/prod/